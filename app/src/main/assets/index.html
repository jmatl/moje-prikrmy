<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moje příkrmy</title><style>body{margin:0;background:#fff8f0;color:#33251f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:760px;margin:auto;padding:18px 14px 80px}.c{background:#fff;border:1px solid #eadbd2;border-radius:18px;padding:15px;margin:12px 0}.r{display:flex;gap:9px;flex-wrap:wrap}.g{flex:1 1 180px}label{display:block;font-size:12px;font-weight:700;color:#76685f;margin:9px 2px 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #eadbd2;border-radius:12px;box-sizing:border-box}textarea{min-height:78px}.b{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:#e87345;color:#fff}.s{background:#fde5d8;color:#8b3e20}.x{background:#f5eee9;color:#33251f}.d{background:#fbe0de;color:#c84b45}.tb{display:flex;gap:8px;flex-wrap:wrap}.food{border-top:1px solid #eadbd2;padding:13px 0}.food:first-child{border-top:0}.name{font-weight:900;font-size:18px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#fde5d8;margin:2px 4px 2px 0}.ok{background:#dcf3e6;color:#226745}.bad{background:#fbe0de;color:#9e312c}.muted{font-size:13px;color:#76685f}.hide{display:none}.msg{margin-top:10px;font-size:13px;font-weight:700;color:#226745}</style></head><body><div class="w"><h1>🥕 Moje příkrmy</h1><p class="muted">Rodinný deníček prvních chutí</p><section class="c"><label>Rodinný klíč</label><input id="familyKey" placeholder="např. MATL-1234"><div class="tb" style="margin-top:10px"><button class="b s" onclick="saveKey()">Uložit klíč</button><button class="b x" onclick="shareDiary()">Sdílet deníček</button><button class="b x" onclick="syncNow()">Synchronizovat</button></div><p id="syncMsg" class="muted">Data se ukládají i lokálně v telefonu.</p></section><section class="c"><h2 id="formTitle">Přidat potravinu</h2><input type="hidden" id="editId"><div class="r"><div class="g"><label>Název</label><input id="foodName"></div><div class="g"><label>Kategorie</label><select id="category"><option>Zelenina</option><option>Ovoce</option><option>Maso</option><option>Obiloviny</option><option>Mléčné</option><option>Luštěniny</option><option>Vejce</option><option>Ryby</option><option>Alergeny</option><option>Ostatní</option></select></div></div><div class="r"><div class="g"><label>Stav</label><select id="foodStatus"><option>Chci zkusit</option><option>Ochutnáno</option></select></div><div class="g"><label>Datum prvního ochutnání</label><input id="firstDate" type="date"></div></div><div class="r"><div class="g"><label>Hodnocení</label><select id="rating"><option value="">Bez hodnocení</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="g"><label>Reakce</label><select id="reaction"><option value="">Bez reakce</option><option>Líbilo se</option><option>Neutrální</option><option>Nechutnalo</option><option>Negativní reakce</option><option>Alergická reakce</option></select></div></div><label>Poznámka</label><textarea id="notes"></textarea><div class="tb" style="margin-top:10px"><button class="b" onclick="saveFood()">Uložit</button><button id="cancelEdit" class="b x hide" onclick="resetForm()">Zrušit úpravu</button></div><div id="saveMsg" class="msg hide"></div></section><section class="c"><div class="r"><div class="g"><label>Hledat</label><input id="search" oninput="render()"></div><div class="g"><label>Stav</label><select id="filterStatus" onchange="render()"><option value="">Všechny</option><option>Chci zkusit</option><option>Ochutnáno</option></select></div></div><p><b id="count">0</b> položek</p><div id="list"></div></section></div><script>
const STORE='mpFoodsV5',KEY='mpKeyV5',API='https://horrible-partial-resource--honzamatl.replit.app';
const $=id=>document.getElementById(id);
const E={familyKey:$('familyKey'),syncMsg:$('syncMsg'),formTitle:$('formTitle'),editId:$('editId'),foodName:$('foodName'),category:$('category'),foodStatus:$('foodStatus'),firstDate:$('firstDate'),rating:$('rating'),reaction:$('reaction'),notes:$('notes'),cancelEdit:$('cancelEdit'),saveMsg:$('saveMsg'),search:$('search'),filterStatus:$('filterStatus'),count:$('count'),list:$('list')};
let foods=[];
try{const raw=localStorage.getItem(STORE);foods=raw?JSON.parse(raw):[]}catch(e){foods=[]}
function persist(syncIt=true){try{localStorage.setItem(STORE,JSON.stringify(foods));render();if(syncIt&&E.familyKey.value.trim())setTimeout(push,300);return true}catch(e){E.saveMsg.textContent='Uložení se nezdařilo.';E.saveMsg.classList.remove('hide');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function flash(t){E.saveMsg.textContent=t;E.saveMsg.classList.remove('hide');setTimeout(()=>E.saveMsg.classList.add('hide'),1800)}
function saveFood(){try{const n=E.foodName.value.trim();if(!n){alert('Zadej název potraviny.');return}const editing=E.editId.value;const item={id:editing||uid(),name:n,category:E.category.value,status:E.foodStatus.value,date:E.firstDate.value,rating:E.rating.value,reaction:E.reaction.value,notes:E.notes.value.trim(),updatedAt:Date.now()};foods=editing?foods.map(x=>x.id===editing?item:x):[item,...foods];if(persist()){resetForm();flash('Uloženo ✓')}}catch(e){alert('Při ukládání nastala chyba.')}}
function editFood(id){const x=foods.find(a=>a.id===id);if(!x)return;E.editId.value=x.id;E.foodName.value=x.name||'';E.category.value=x.category||'Zelenina';E.foodStatus.value=x.status||'Chci zkusit';E.firstDate.value=x.date||'';E.rating.value=x.rating||'';E.reaction.value=x.reaction||'';E.notes.value=x.notes||'';E.formTitle.textContent='Upravit potravinu';E.cancelEdit.classList.remove('hide');window.scrollTo(0,200)}
function delFood(id){if(confirm('Smazat tuto potravinu?')){foods=foods.filter(x=>x.id!==id);persist()}}
function resetForm(){E.editId.value='';E.foodName.value='';E.firstDate.value='';E.rating.value='';E.reaction.value='';E.notes.value='';E.foodStatus.value='Chci zkusit';E.category.value='Zelenina';E.formTitle.textContent='Přidat potravinu';E.cancelEdit.classList.add('hide')}
function render(){const q=E.search.value.toLowerCase();const fs=E.filterStatus.value;const a=foods.filter(x=>(!q||((x.name||'')+' '+(x.notes||'')+' '+(x.category||'')).toLowerCase().includes(q))&&(!fs||x.status===fs));E.count.textContent=String(a.length);E.list.innerHTML=a.length?a.map(x=>`<div class="food"><div class="name">${esc(x.name)}</div><span class="badge">${esc(x.category)}</span><span class="badge ${x.status==='Ochutnáno'?'ok':''}">${esc(x.status)}</span>${x.reaction?`<span class="badge ${/Alerg|Negativ|Nechutnalo/.test(x.reaction)?'bad':'ok'}">${esc(x.reaction)}</span>`:''}<div class="muted">${x.date?esc(x.date):''}${x.rating?' · '+('★'.repeat(+x.rating)):''}</div><div>${esc(x.notes||'')}</div><div class="tb" style="margin-top:8px"><button class="b x" onclick="editFood('${x.id}')">Upravit</button><button class="b d" onclick="delFood('${x.id}')">Smazat</button></div></div>`).join(''):'<p class="muted">Zatím tu nic není.</p>'}
function familyKey(){return E.familyKey.value.trim().toUpperCase()}
function saveKey(){const k=familyKey();if(!k){alert('Zadej rodinný klíč.');return}E.familyKey.value=k;try{localStorage.setItem(KEY,k)}catch(e){}E.syncMsg.textContent='Klíč uložen. Synchronizuji…';syncNow()}
function shareDiary(){let k=familyKey();if(!k){k='RODINA-'+Math.random().toString(36).slice(2,8).toUpperCase();E.familyKey.value=k;try{localStorage.setItem(KEY,k)}catch(e){}}const t='Moje příkrmy – rodinný klíč: '+k;if(window.Android&&Android.share)Android.share(t);else prompt('Zkopíruj:',t)}
async function push(){const k=familyKey();if(!k)return;try{const r=await fetch(API+'/api/families/'+encodeURIComponent(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({foods})});if(!r.ok)throw new Error();E.syncMsg.textContent='Synchronizováno mezi telefony.';E.syncMsg.className='muted ok'}catch(e){E.syncMsg.textContent='Offline – data zůstávají v telefonu.';E.syncMsg.className='muted bad'}}
async function syncNow(){const k=familyKey();if(!k)return;try{const r=await fetch(API+'/api/families/'+encodeURIComponent(k),{cache:'no-store'});if(r.status===404){await push();return}if(!r.ok)throw new Error();const d=await r.json();if(Array.isArray(d.foods)){foods=d.foods;persist(false)}E.syncMsg.textContent='Synchronizováno mezi telefony.';E.syncMsg.className='muted ok'}catch(e){E.syncMsg.textContent='Offline – data zůstávají v telefonu.';E.syncMsg.className='muted bad'}}
try{E.familyKey.value=localStorage.getItem(KEY)||''}catch(e){}render();if(familyKey()){syncNow();setInterval(syncNow,10000)}
</script></body></html>
