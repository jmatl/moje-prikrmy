<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moje příkrmy</title><style>body{margin:0;background:#fff8f0;color:#33251f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:760px;margin:auto;padding:18px 14px 80px}.c{background:#fff;border:1px solid #eadbd2;border-radius:18px;padding:15px;margin:12px 0}.r{display:flex;gap:9px;flex-wrap:wrap}.g{flex:1 1 180px}label{display:block;font-size:12px;font-weight:700;color:#76685f;margin:9px 2px 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #eadbd2;border-radius:12px;box-sizing:border-box}textarea{min-height:78px}.b{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:#e87345;color:#fff}.s{background:#fde5d8;color:#8b3e20}.x{background:#f5eee9;color:#33251f}.d{background:#fbe0de;color:#c84b45}.tb{display:flex;gap:8px;flex-wrap:wrap}.food{border-top:1px solid #eadbd2;padding:13px 0}.food:first-child{border-top:0}.name{font-weight:900;font-size:18px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#fde5d8;margin:2px 4px 2px 0}.ok{background:#dcf3e6;color:#226745}.bad{background:#fbe0de;color:#9e312c}.muted{font-size:13px;color:#76685f}.hide{display:none}</style></head><body><div class="w"><h1>🥕 Moje příkrmy</h1><p class="muted">Rodinný deníček prvních chutí</p><section class="c"><label>Rodinný klíč</label><input id="familyKey" placeholder="např. MATL-1234"><div class="tb" style="margin-top:10px"><button class="b s" onclick="saveKey()">Uložit klíč</button><button class="b x" onclick="shareDiary()">Sdílet deníček</button><button class="b x" onclick="syncNow()">Synchronizovat</button></div><p id="sync" class="muted">Data se ukládají i lokálně v telefonu.</p></section><section class="c"><h2 id="ft">Přidat potravinu</h2><input type="hidden" id="editId"><div class="r"><div class="g"><label>Název</label><input id="name"></div><div class="g"><label>Kategorie</label><select id="cat"><option>Zelenina</option><option>Ovoce</option><option>Maso</option><option>Obiloviny</option><option>Mléčné</option><option>Luštěniny</option><option>Vejce</option><option>Ryby</option><option>Alergeny</option><option>Ostatní</option></select></div></div><div class="r"><div class="g"><label>Stav</label><select id="status"><option>Chci zkusit</option><option>Ochutnáno</option></select></div><div class="g"><label>Datum prvního ochutnání</label><input id="date" type="date"></div></div><div class="r"><div class="g"><label>Hodnocení</label><select id="rating"><option value="">Bez hodnocení</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="g"><label>Reakce</label><select id="reaction"><option value="">Bez reakce</option><option>Líbilo se</option><option>Neutrální</option><option>Nechutnalo</option><option>Negativní reakce</option><option>Alergická reakce</option></select></div></div><label>Poznámka</label><textarea id="notes"></textarea><div class="tb" style="margin-top:10px"><button class="b" onclick="saveFood()">Uložit</button><button id="cancel" class="b x hide" onclick="resetForm()">Zrušit úpravu</button></div></section><section class="c"><div class="r"><div class="g"><label>Hledat</label><input id="search" oninput="render()"></div><div class="g"><label>Stav</label><select id="fstatus" onchange="render()"><option value="">Všechny</option><option>Chci zkusit</option><option>Ochutnáno</option></select></div></div><p><b id="count">0</b> položek</p><div id="list"></div></section></div><script>const STORE='mpFoodsV4',KEY='mpKeyV4',API='https://horrible-partial-resource--honzamatl.replit.app';let foods=JSON.parse(localStorage.getItem(STORE)||'[]');function persist(syncIt=true){localStorage.setItem(STORE,JSON.stringify(foods));render();if(syncIt&&familyKey.value.trim())setTimeout(push,300)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function saveFood(){let n=name.value.trim();if(!n){alert('Zadej název potraviny.');return}let item={id:editId.value||uid(),name:n,category:cat.value,status:status.value,date:date.value,rating:rating.value,reaction:reaction.value,notes:notes.value.trim(),updatedAt:Date.now()};foods=editId.value?foods.map(x=>x.id===editId.value?item:x):[item,...foods];persist();resetForm()}function editFood(id){let x=foods.find(a=>a.id===id);if(!x)return;editId.value=x.id;name.value=x.name;cat.value=x.category;status.value=x.status;date.value=x.date||'';rating.value=x.rating||'';reaction.value=x.reaction||'';notes.value=x.notes||'';ft.textContent='Upravit potravinu';cancel.classList.remove('hide');scrollTo(0,200)}function delFood(id){if(confirm('Smazat tuto potravinu?')){foods=foods.filter(x=>x.id!==id);persist()}}function resetForm(){editId.value='';name.value='';date.value='';rating.value='';reaction.value='';notes.value='';status.value='Chci zkusit';cat.value='Zelenina';ft.textContent='Přidat potravinu';cancel.classList.add('hide')}function render(){let q=search.value.toLowerCase(),fs=fstatus.value;let a=foods.filter(x=>(!q||(x.name+' '+x.notes+' '+x.category).toLowerCase().includes(q))&&(!fs||x.status===fs));count.textContent=a.length;list.innerHTML=a.length?a.map(x=>`<div class="food"><div class="name">${esc(x.name)}</div><span class="badge">${esc(x.category)}</span><span class="badge ${x.status==='Ochutnáno'?'ok':''}">${esc(x.status)}</span>${x.reaction?`<span class="badge ${/Alerg|Negativ|Nechutnalo/.test(x.reaction)?'bad':'ok'}">${esc(x.reaction)}</span>`:''}<div class="muted">${x.date?esc(x.date):''}${x.rating?' · '+('★'.repeat(+x.rating)):''}</div><div>${esc(x.notes||'')}</div><div class="tb" style="margin-top:8px"><button class="b x" onclick="editFood('${x.id}')">Upravit</button><button class="b d" onclick="delFood('${x.id}')">Smazat</button></div></div>`).join(''):'<p class="muted">Zatím tu nic není.</p>'}function key(){return familyKey.value.trim().toUpperCase()}function saveKey(){let k=key();if(!k){alert('Zadej rodinný klíč.');return}familyKey.value=k;localStorage.setItem(KEY,k);sync.textContent='Klíč uložen. Synchronizuji…';syncNow()}function shareDiary(){let k=key();if(!k){k='RODINA-'+Math.random().toString(36).slice(2,8).toUpperCase();familyKey.value=k;localStorage.setItem(KEY,k)}let t='Moje příkrmy – rodinný klíč: '+k;if(window.Android&&Android.share)Android.share(t);else prompt('Zkopíruj:',t)}async function push(){let k=key();if(!k)return;try{let r=await fetch(API+'/api/families/'+encodeURIComponent(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({foods})});if(!r.ok)throw 0;sync.textContent='Synchronizováno mezi telefony.';sync.className='muted ok'}catch(e){sync.textContent='Offline – data zůstávají v telefonu.';sync.className='muted bad'}}async function syncNow(){let k=key();if(!k)return;try{let r=await fetch(API+'/api/families/'+encodeURIComponent(k),{cache:'no-store'});if(r.status===404){await push();return}if(!r.ok)throw 0;let d=await r.json();if(Array.isArray(d.foods)){foods=d.foods;persist(false)}sync.textContent='Synchronizováno mezi telefony.';sync.className='muted ok'}catch(e){sync.textContent='Offline – data zůstávají v telefonu.';sync.className='muted bad'}}familyKey.value=localStorage.getItem(KEY)||'';render();if(key()){syncNow();setInterval(syncNow,10000)}</script></body></html>
